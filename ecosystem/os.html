<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXORA OS</title><style>:root{color-scheme:dark;--bg:#080a14;--panel:#111528;--line:#293151;--text:#f4f6ff;--muted:#9aa5c7;--violet:#a78bfa;--cyan:#67e8f9}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#25204f,transparent 42%),var(--bg);color:var(--text);font:15px/1.6 system-ui,sans-serif}.wrap{width:min(1000px,calc(100% - 30px));margin:auto}.nav{display:flex;align-items:center;gap:10px;height:66px;border-bottom:1px solid #ffffff18}.brand{color:inherit;text-decoration:none;font-size:20px;font-weight:900}.spacer{flex:1}.panel{border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:20px;margin:14px 0}.back,.btn{display:inline-block;padding:10px 13px;border:1px solid var(--line);border-radius:10px;background:#171d34;color:var(--text);text-decoration:none;font-weight:750;cursor:pointer}.muted{color:var(--muted)}h1{font-size:clamp(34px,6vw,56px);line-height:1.05;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.app{display:flex;align-items:center;gap:10px;min-height:82px;padding:12px;border:1px solid var(--line);border-radius:13px;background:#0c1020;color:inherit;text-decoration:none}.app .ico{font-size:25px}.app .desc{display:block;font-size:11px;color:var(--muted)}input{width:100%;padding:11px;border:1px solid #343e60;border-radius:10px;background:#090d1b;color:white;font:inherit}.row{display:flex;gap:9px;flex-wrap:wrap}.foot{font-size:11px;color:var(--muted);padding:25px 0}body.light{background:#eef2ff;color:#17203a}body.light .panel,body.light .app{background:#fff}body.light input{background:#f8faff;color:#17203a}@media(max-width:650px){.grid{grid-template-columns:1fr}.panel{padding:15px}}</style></head><body><header class="wrap nav"><a class="brand" href="index.html">◈ NEXORA</a><span class="spacer"></span><button class="btn" id="theme">☼ Тема</button></header><main class="wrap"><a class="back" href="index.html">← Главная экосистемы</a><h1>NEXORA OS</h1><p class="muted">Единая панель запуска приложений, избранного и недавних переходов. Это веб-панель экосистемы, не замена Android или Windows.</p><section class="panel"><div class="row" style="justify-content:space-between"><h2>Приложения</h2><button class="btn" id="reset">Сбросить избранное</button></div><div id="apps" class="grid"></div></section><div class="grid" style="grid-template-columns:1fr 1fr"><section class="panel"><h2>Недавние</h2><div id="recent" class="row"></div></section><section class="panel"><h2>Настройки</h2><label class="muted" for="workspace">Название рабочего пространства</label><input id="workspace" maxlength="50" placeholder="Моё пространство" style="margin:8px 0"><button class="btn" id="save">Сохранить</button><p class="muted" id="status"></p></section></div><footer class="foot">NEXORA OS · Настройки и история открытий хранятся в браузере.</footer></main><script>(()=>{const $=id=>document.getElementById(id),mods=[['desk','▦','Desk','Проекты и задачи'],['forge','⌘','Forge','Редактор кода'],['core','◈','Core','Поиск и данные'],['intelligence','✦','Intelligence','Текстовая лаборатория'],['world','🌐','World','Конструктор мира'],['learn','✎','Learn','Карточки обучения'],['studio','▧','Studio','Творческая доска'],['connect','◎','Connect','Локальные контакты']];const F='nexora-os-fav-v1',R='nexora-os-recent-v1',W='nexora-os-workspace-v1';let fav=['desk','forge','core'],recent=[],theme='dark',workspace='';try{fav=JSON.parse(localStorage.getItem(F)||JSON.stringify(fav));recent=JSON.parse(localStorage.getItem(R)||'[]');workspace=localStorage.getItem(W)||'';theme=localStorage.getItem('nexora-theme-v1')||'dark'}catch(e){}function setTheme(){document.body.classList.toggle('light',theme==='light');$('theme').textContent=theme==='light'?'☾ Тёмная':'☼ Светлая'}setTheme();$('theme').onclick=()=>{theme=theme==='light'?'dark':'light';setTheme();try{localStorage.setItem('nexora-theme-v1',theme)}catch(e){}};function render(){const box=$('apps');box.replaceChildren();mods.forEach(m=>{const a=document.createElement('a');a.className='app';a.href=m[0]+'.html';const ic=document.createElement('span');ic.className='ico';ic.textContent=m[1];const label=document.createElement('span');label.innerHTML='<b>'+m[2]+'</b><span class="desc">'+m[3]+'</span>';const star=document.createElement('button');star.className='btn';star.textContent=fav.includes(m[0])?'★':'☆';star.onclick=e=>{e.preventDefault();e.stopPropagation();fav=fav.includes(m[0])?fav.filter(x=>x!==m[0]):fav.concat(m[0]);try{localStorage.setItem(F,JSON.stringify(fav))}catch(e){}render()};a.append(ic,label,star);a.onclick=()=>{recent=[m[0],...recent.filter(x=>x!==m[0])].slice(0,5);try{localStorage.setItem(R,JSON.stringify(recent))}catch(e){}};box.append(a)});const rb=$('recent');rb.replaceChildren();if(!recent.length)rb.textContent='Открывай модули — они появятся здесь.';recent.forEach(id=>{const m=mods.find(x=>x[0]===id);if(!m)return;const a=document.createElement('a');a.className='btn';a.href=id+'.html';a.textContent=m[1]+' '+m[2];rb.append(a)});$('workspace').value=workspace}$('reset').onclick=()=>{fav=['desk','forge','core'];try{localStorage.setItem(F,JSON.stringify(fav))}catch(e){}render()};$('save').onclick=()=>{workspace=$('workspace').value.trim();try{localStorage.setItem(W,workspace);$('status').textContent='Настройки сохранены.'}catch(e){$('status').textContent='Не удалось сохранить.'}};render()})();</script></body></html>
