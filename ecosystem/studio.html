<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXORA Studio</title><style>:root{color-scheme:dark;--bg:#080a14;--panel:#111528;--line:#293151;--text:#f4f6ff;--muted:#9aa5c7;--v:#a78bfa;--c:#67e8f9}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#25204f,transparent 42%),var(--bg);color:var(--text);font:15px/1.6 system-ui,sans-serif}.wrap{width:min(1000px,calc(100% - 30px));margin:auto}.nav{display:flex;gap:12px;align-items:center;height:66px;border-bottom:1px solid #ffffff18}.brand{font-size:20px;font-weight:900;color:inherit;text-decoration:none}.spacer{flex:1}.panel{border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:20px;margin:14px 0}.back,.btn{display:inline-block;padding:10px 13px;border:1px solid var(--line);border-radius:10px;background:#171d34;color:var(--text);text-decoration:none;font-weight:750;cursor:pointer}.primary{background:linear-gradient(100deg,var(--v),var(--c));color:#101224;border:0}.danger{color:#fecdd3}.muted{color:var(--muted)}h1{font-size:clamp(34px,6vw,56px);line-height:1.05;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}input,textarea,select{width:100%;padding:11px;border:1px solid #343e60;border-radius:10px;background:#090d1b;color:white;font:inherit}.field{display:block;margin:12px 0;color:var(--muted);font-size:12px}.field input,.field textarea,.field select{display:block;margin-top:6px}.row{display:flex;gap:9px;flex-wrap:wrap}.item{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:#0c1020;margin:8px 0}.item span:first-child{flex:1;overflow-wrap:anywhere}.foot{font-size:11px;color:var(--muted);padding:25px 0}body.light{background:#eef2ff;color:#17203a}body.light .panel,body.light .item{background:#fff}body.light input,body.light textarea,body.light select{background:#f8faff;color:#17203a}@media(max-width:650px){.grid,.grid3{grid-template-columns:1fr}.panel{padding:15px}}</style></head><body><header class="wrap nav"><a class="brand" href="index.html">◈ NEXORA</a><span class="spacer"></span><button class="btn" id="theme">☼ Тема</button></header><main class="wrap"><a class="back" href="index.html">← Главная экосистемы</a><h1>NEXORA Studio</h1><p class="muted">Творческая доска для идей, черновиков и заметок. Сохраняй карточки локально и экспортируй доску в Markdown.</p><section class="panel"><div class="grid"><label class="field">Заголовок<input id="title" maxlength="80" placeholder="Идея проекта"></label><label class="field">Цвет<select id="color"><option value="#a78bfa">Фиолетовый</option><option value="#67e8f9">Бирюзовый</option><option value="#6ee7b7">Мятный</option><option value="#fbbf24">Янтарный</option></select></label></div><label class="field">Текст<textarea id="body" maxlength="1500" placeholder="Опиши идею..."></textarea></label><button class="btn primary" id="add">Добавить карточку</button></section><section class="panel"><div class="row"><h2>Моя доска</h2><button class="btn" id="export">Экспорт Markdown</button><button class="btn danger" id="clear">Очистить</button></div><div id="board" class="grid3"></div></section><footer class="foot">NEXORA Studio · Локальная творческая доска.</footer></main><script>(()=>{const $=id=>document.getElementById(id),K='nexora-studio-board-v1';let notes=[],theme='dark';try{notes=JSON.parse(localStorage.getItem(K)||'[]');theme=localStorage.getItem('nexora-theme-v1')||'dark';if(!Array.isArray(notes))notes=[]}catch(e){}function th(){document.body.classList.toggle('light',theme==='light');$('theme').textContent=theme==='light'?'☾ Тёмная':'☼ Светлая'}th();$('theme').onclick=()=>{theme=theme==='light'?'dark':'light';th();try{localStorage.setItem('nexora-theme-v1',theme)}catch(e){}};function save(){try{localStorage.setItem(K,JSON.stringify(notes))}catch(e){}}function render(){const board=$('board');board.replaceChildren();if(!notes.length){board.textContent='Доска пуста. Добавь первую идею.';return}notes.forEach(n=>{const c=document.createElement('article');c.className='panel';c.style.borderTop='3px solid '+n.color;const h=document.createElement('h3');h.textContent=n.title;const p=document.createElement('p');p.style.whiteSpace='pre-wrap';p.textContent=n.body;const b=document.createElement('button');b.className='btn danger';b.textContent='Удалить';b.onclick=()=>{notes=notes.filter(x=>x.id!==n.id);save();render()};c.append(h,p,b);board.append(c)})}$('add').onclick=()=>{const title=$('title').value.trim(),body=$('body').value.trim();if(!title&&!body)return;notes.unshift({id:Date.now().toString(36),title:title||'Без названия',body,color:$('color').value});save();$('title').value='';$('body').value='';render()};$('clear').onclick=()=>{if(confirm('Удалить все карточки?')){notes=[];save();render()}};$('export').onclick=()=>{const md=notes.map(n=>'## '+n.title+'\n\n'+n.body).join('\n\n---\n\n'),u=URL.createObjectURL(new Blob([md],{type:'text/markdown;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='nexora-studio-board.md';a.click();setTimeout(()=>URL.revokeObjectURL(u),500)};render()})();</script></body></html>
