<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXORA Learn</title><style>:root{color-scheme:dark;--bg:#080a14;--panel:#111528;--line:#293151;--text:#f4f6ff;--muted:#9aa5c7;--v:#a78bfa;--c:#67e8f9}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#25204f,transparent 42%),var(--bg);color:var(--text);font:15px/1.6 system-ui,sans-serif}.wrap{width:min(1000px,calc(100% - 30px));margin:auto}.nav{display:flex;gap:12px;align-items:center;height:66px;border-bottom:1px solid #ffffff18}.brand{font-size:20px;font-weight:900;color:inherit;text-decoration:none}.spacer{flex:1}.panel{border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:20px;margin:14px 0}.back,.btn{display:inline-block;padding:10px 13px;border:1px solid var(--line);border-radius:10px;background:#171d34;color:var(--text);text-decoration:none;font-weight:750;cursor:pointer}.primary{background:linear-gradient(100deg,var(--v),var(--c));color:#101224;border:0}.danger{color:#fecdd3}.muted{color:var(--muted)}h1{font-size:clamp(34px,6vw,56px);line-height:1.05;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}input,textarea,select{width:100%;padding:11px;border:1px solid #343e60;border-radius:10px;background:#090d1b;color:white;font:inherit}.field{display:block;margin:12px 0;color:var(--muted);font-size:12px}.field input,.field textarea,.field select{display:block;margin-top:6px}.row{display:flex;gap:9px;flex-wrap:wrap}.item{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:#0c1020;margin:8px 0}.item span:first-child{flex:1;overflow-wrap:anywhere}.foot{font-size:11px;color:var(--muted);padding:25px 0}body.light{background:#eef2ff;color:#17203a}body.light .panel,body.light .item{background:#fff}body.light input,body.light textarea,body.light select{background:#f8faff;color:#17203a}@media(max-width:650px){.grid,.grid3{grid-template-columns:1fr}.panel{padding:15px}}</style></head><body><header class="wrap nav"><a class="brand" href="index.html">◈ NEXORA</a><span class="spacer"></span><button class="btn" id="theme">☼ Тема</button></header><main class="wrap"><a class="back" href="index.html">← Главная экосистемы</a><h1>NEXORA Learn</h1><p class="muted">Создавай карточки для повторения терминов, фактов и вопросов. Данные остаются в этом браузере.</p><div class="grid"><section class="panel"><h2>Новая карточка</h2><label class="field">Вопрос<input id="q" maxlength="180" placeholder="Что такое HTML?"></label><label class="field">Ответ<textarea id="a" maxlength="800" placeholder="Язык разметки веб-страниц"></textarea></label><button class="btn primary" id="add">Добавить</button><p class="muted" id="count"></p></section><section class="panel"><h2>Повторение</h2><div class="item" id="study" style="min-height:130px">Добавь первую карточку.</div><div class="row"><button class="btn" id="reveal">Показать ответ</button><button class="btn primary" id="next">Следующая</button></div><p class="muted" id="progress"></p></section></div><section class="panel"><div class="row"><h2>Моя колода</h2><button class="btn" id="export">Экспорт JSON</button></div><div id="list"></div></section><footer class="foot">NEXORA Learn · Локальное обучение без аккаунта.</footer></main><script>(()=>{const $=id=>document.getElementById(id),K='nexora-learn-cards-v1';let cards=[],i=0,shown=false,theme='dark';try{cards=JSON.parse(localStorage.getItem(K)||'[]');theme=localStorage.getItem('nexora-theme-v1')||'dark';if(!Array.isArray(cards))cards=[]}catch(e){}function th(){document.body.classList.toggle('light',theme==='light');$('theme').textContent=theme==='light'?'☾ Тёмная':'☼ Светлая'}th();$('theme').onclick=()=>{theme=theme==='light'?'dark':'light';th();try{localStorage.setItem('nexora-theme-v1',theme)}catch(e){}};function save(){try{localStorage.setItem(K,JSON.stringify(cards))}catch(e){}}function render(){const list=$('list');list.replaceChildren();$('count').textContent='Карточек: '+cards.length;if(!cards.length)list.textContent='Пока пусто.';cards.forEach((c,n)=>{const row=document.createElement('div');row.className='item';const s=document.createElement('span');s.textContent=c.q;const b=document.createElement('button');b.className='btn danger';b.textContent='Удалить';b.onclick=()=>{cards.splice(n,1);i=cards.length?i%cards.length:0;save();render()};row.append(s,b);list.append(row)});study()}function study(){const box=$('study');box.textContent=cards.length?(shown?cards[i].a:cards[i].q):'Добавь первую карточку.';$('progress').textContent=cards.length?'Карточка '+(i+1)+' из '+cards.length:''} $('add').onclick=()=>{const q=$('q').value.trim(),a=$('a').value.trim();if(!q||!a)return;cards.push({q,a});save();$('q').value='';$('a').value='';render()};$('reveal').onclick=()=>{if(cards.length){shown=!shown;study()}};$('next').onclick=()=>{if(cards.length){i=(i+1)%cards.length;shown=false;study()}};$('export').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(cards,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='nexora-learn-cards.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),500)};render()})();</script></body></html>
