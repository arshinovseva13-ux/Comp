<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXORA Connect</title><style>:root{color-scheme:dark;--bg:#080a14;--panel:#111528;--line:#293151;--text:#f4f6ff;--muted:#9aa5c7;--v:#a78bfa;--c:#67e8f9}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#25204f,transparent 42%),var(--bg);color:var(--text);font:15px/1.6 system-ui,sans-serif}.wrap{width:min(1000px,calc(100% - 30px));margin:auto}.nav{display:flex;gap:12px;align-items:center;height:66px;border-bottom:1px solid #ffffff18}.brand{font-size:20px;font-weight:900;color:inherit;text-decoration:none}.spacer{flex:1}.panel{border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:20px;margin:14px 0}.back,.btn{display:inline-block;padding:10px 13px;border:1px solid var(--line);border-radius:10px;background:#171d34;color:var(--text);text-decoration:none;font-weight:750;cursor:pointer}.primary{background:linear-gradient(100deg,var(--v),var(--c));color:#101224;border:0}.danger{color:#fecdd3}.muted{color:var(--muted)}h1{font-size:clamp(34px,6vw,56px);line-height:1.05;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}input,textarea,select{width:100%;padding:11px;border:1px solid #343e60;border-radius:10px;background:#090d1b;color:white;font:inherit}.field{display:block;margin:12px 0;color:var(--muted);font-size:12px}.field input,.field textarea,.field select{display:block;margin-top:6px}.row{display:flex;gap:9px;flex-wrap:wrap}.item{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:#0c1020;margin:8px 0}.item span:first-child{flex:1;overflow-wrap:anywhere}.foot{font-size:11px;color:var(--muted);padding:25px 0}body.light{background:#eef2ff;color:#17203a}body.light .panel,body.light .item{background:#fff}body.light input,body.light textarea,body.light select{background:#f8faff;color:#17203a}@media(max-width:650px){.grid,.grid3{grid-template-columns:1fr}.panel{padding:15px}}</style></head><body><header class="wrap nav"><a class="brand" href="index.html">◈ NEXORA</a><span class="spacer"></span><button class="btn" id="theme">☼ Тема</button></header><main class="wrap"><a class="back" href="index.html">← Главная экосистемы</a><h1>NEXORA Connect</h1><p class="muted">Личная адресная книга контактов и проектов. Пока это локальный прототип: он не отправляет сообщения и не подключает других пользователей.</p><div class="grid"><section class="panel"><h2>Добавить контакт</h2><label class="field">Имя или проект<input id="name" maxlength="100" placeholder="Разработчик / команда"></label><label class="field">Ссылка<input id="url" type="url" placeholder="https://example.com"></label><label class="field">Заметка<textarea id="note" maxlength="500" placeholder="Полезная информация"></textarea></label><button class="btn primary" id="add">Сохранить</button></section><section class="panel"><div class="row"><h2>Контакты</h2><span class="muted" id="count">0</span></div><input id="search" placeholder="Поиск по контактам"><div id="list"></div></section></div><footer class="foot">NEXORA Connect · Контакты хранятся в этом браузере.</footer></main><script>(()=>{const $=id=>document.getElementById(id),K='nexora-connect-contacts-v1';let contacts=[],theme='dark';try{contacts=JSON.parse(localStorage.getItem(K)||'[]');theme=localStorage.getItem('nexora-theme-v1')||'dark';if(!Array.isArray(contacts))contacts=[]}catch(e){}function th(){document.body.classList.toggle('light',theme==='light');$('theme').textContent=theme==='light'?'☾ Тёмная':'☼ Светлая'}th();$('theme').onclick=()=>{theme=theme==='light'?'dark':'light';th();try{localStorage.setItem('nexora-theme-v1',theme)}catch(e){}};function save(){try{localStorage.setItem(K,JSON.stringify(contacts))}catch(e){}}function render(){const list=$('list'),q=$('search').value.trim().toLowerCase();list.replaceChildren();$('count').textContent=contacts.length;const matches=contacts.filter(c=>(c.name+' '+c.note+' '+c.url).toLowerCase().includes(q));if(!matches.length){list.textContent='Контакты не найдены.';return}matches.forEach(c=>{const row=document.createElement('div');row.className='item';const box=document.createElement('span');const b=document.createElement('b');b.textContent=c.name;const p=document.createElement('p');p.className='muted';p.textContent=c.note;box.append(b,p);if(c.url){const a=document.createElement('a');a.href=c.url;a.target='_blank';a.rel='noopener';a.className='btn';a.textContent='Открыть ↗';box.append(a)}const d=document.createElement('button');d.className='btn danger';d.textContent='Удалить';d.onclick=()=>{contacts=contacts.filter(x=>x.id!==c.id);save();render()};row.append(box,d);list.append(row)})}$('add').onclick=()=>{const name=$('name').value.trim();let url=$('url').value.trim();if(!name)return;if(url&&!/^https?:\/\//i.test(url)){alert('Ссылка должна начинаться с https:// или http://');return}contacts.unshift({id:Date.now().toString(36),name,url,note:$('note').value.trim()});save();$('name').value='';$('url').value='';$('note').value='';render()};$('search').oninput=render;render()})();</script></body></html>
