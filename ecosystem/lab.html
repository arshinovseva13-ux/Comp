<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080a14"><title>NEXORA Lab — NEXORA</title><style>
:root{color-scheme:dark;--bg:#080a14;--panel:#111528;--line:#293151;--text:#f4f6ff;--muted:#9aa5c7;--violet:#a78bfa;--cyan:#67e8f9}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#25204f 0,transparent 42%),var(--bg);color:var(--text);font:15px/1.6 system-ui, sans-serif}.wrap{width:min(1000px,calc(100% - 32px));margin:auto}.top{display:flex;align-items:center;gap:12px;padding:20px 0;border-bottom:1px solid #ffffff18}.brand{font-weight:900;font-size:20px;margin-right:auto}.btn,button{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:#171d34;color:var(--text);cursor:pointer}.primary{background:linear-gradient(100deg,var(--violet),var(--cyan));color:#101224;border:0;font-weight:800}.hero{padding:40px 0 24px}.kicker{font-size:11px;letter-spacing:2px;color:var(--cyan);font-weight:800}.hero h1{font-size:clamp(32px,6vw,54px);letter-spacing:-1.8px;line-height:1.05;margin:8px 0}.muted{color:var(--muted)}.panel{border:1px solid var(--line);background:#111528cc;border-radius:16px;padding:18px;margin:12px 0}.form{display:flex;gap:8px;flex-wrap:wrap}.field,textarea,select{min-width:0;flex:1;background:#080b17;border:1px solid var(--line);border-radius:9px;color:var(--text);padding:12px;font:inherit}.list{display:grid;gap:9px;margin-top:14px}.item{border:1px solid var(--line);border-radius:12px;padding:13px;display:flex;gap:10px;align-items:flex-start;overflow-wrap:anywhere}.item .body{flex:1;min-width:0}.item p{margin:4px 0;color:var(--muted);font-size:13px}.actions{display:flex;gap:6px;flex-wrap:wrap}.small{font-size:12px;color:var(--muted)}a{color:#c4b5fd}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.column{min-height:160px}.column h2{font-size:15px;margin:0}.column .item{display:block}.column .actions{margin-top:8px}@media(max-width:650px){.grid{grid-template-columns:1fr}.top{flex-wrap:wrap}.hero{padding-top:28px}}
</style></head><body><div class="wrap"><header class="top"><div class="brand">✦ NEXORA <span class="muted">/ Lab</span></div><a class="btn" href="index.html">← Главная экосистемы</a></header><section class="hero"><div class="kicker">EXPERIMENTS · NEXORA ECOSYSTEM</div><h1>NEXORA Lab</h1><p class="muted">Рабочая лаборатория для гипотез, экспериментов и коротких выводов.</p></section>
<section class="panel"><h2>Новый эксперимент</h2><form id="form" class="form"><input class="field" id="name" maxlength="100" placeholder="Название гипотезы или эксперимента" required><textarea class="field" id="detail" maxlength="1200" placeholder="Что проверяешь? Какой результат ожидаешь?" rows="2"></textarea><button class="primary">Добавить</button></form></section><section class="panel"><div class="form"><input class="field" id="search" placeholder="Поиск по экспериментам…"><button id="export">Экспорт JSON</button></div><div id="list" class="list"></div></section><p class="small">Данные сохраняются только в этом браузере. Это самостоятельный модуль NEXORA; серверная синхронизация пока не подключена.</p></div><script>
const K='nexora-lab-v1';let rows=[];try{rows=JSON.parse(localStorage.getItem(K)||'[]')}catch{};const $=id=>document.getElementById(id);function save(){localStorage.setItem(K,JSON.stringify(rows));render()}function render(){const q=$('search').value.toLowerCase();$('list').innerHTML=rows.map((r,i)=>({...r,i})).filter(r=>(r.name+' '+r.detail).toLowerCase().includes(q)).map(r=>'<article class="item"><div class="body"><b>'+esc(r.name)+'</b><p>'+esc(r.detail||'Описание не добавлено')+'</p><span class="small">'+esc(r.date)+' · '+esc(r.status)+'</span></div><div class="actions"><button onclick="toggle('+r.i+')">'+(r.status==='Готово'?'Вернуть':'Завершить')+'</button><button onclick="removeRow('+r.i+')">Удалить</button></div></article>').join('')||'<p class="muted">Пока нет экспериментов. Добавь первую гипотезу.</p>'}function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}window.toggle=i=>{rows[i].status=rows[i].status==='Готово'?'В работе':'Готово';save()};window.removeRow=i=>{if(confirm('Удалить эксперимент?')){rows.splice(i,1);save()}};$('form').onsubmit=e=>{e.preventDefault();rows.unshift({name:$('name').value.trim(),detail:$('detail').value.trim(),date:new Date().toLocaleDateString('ru-RU'),status:'В работе'});$('form').reset();save()};$('search').oninput=render;$('export').onclick=()=>download('nexora-lab.json',rows);function download(n,d){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));a.download=n;a.click();URL.revokeObjectURL(a.href)}render();</script></body></html>
