<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Компилятор HTML/CSS/JS - Интегрированная песочница</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(145deg, #1a1e2c 0%, #2a2f3f 100%);
            font-family: 'Segoe UI', 'Fira Code', 'Monaco', monospace;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        /* Главный контейнер */
        .app {
            width: 1400px;
            max-width: 98vw;
            height: 95vh;
            background: #0f1219;
            border-radius: 32px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            backdrop-filter: blur(2px);
        }

        /* Верхняя панель с кнопками */
        .toolbar {
            background: #1e2438;
            padding: 12px 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 1px solid #2e3a55;
            align-items: center;
            justify-content: space-between;
        }

        .tabs {
            display: flex;
            gap: 8px;
            background: #0b0e16;
            padding: 4px;
            border-radius: 60px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: #a9b7e6;
            font-weight: 600;
            font-family: inherit;
            padding: 8px 20px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.2s;
            letter-spacing: 0.5px;
        }

        .tab-btn.active {
            background: #4c7cf3;
            color: white;
            box-shadow: 0 4px 12px rgba(76, 124, 243, 0.4);
        }

        .action-group {
            display: flex;
            gap: 12px;
        }

        .btn {
            background: #2a3448;
            border: none;
            padding: 8px 18px;
            border-radius: 40px;
            font-family: inherit;
            font-weight: bold;
            color: #e2e8ff;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: #3b5fcf;
            color: white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        .btn-primary:hover {
            background: #5b7ef0;
            transform: scale(0.98);
        }

        .btn:hover {
            background: #3e4a66;
        }

        /* Основная область: редакторы + превью */
        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
            padding: 12px;
            gap: 14px;
            background: #0c0f17;
        }

        /* Панель редакторов */
        .editor-panel {
            flex: 1.2;
            background: #141a27;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            border: 1px solid #2c3548;
        }

        .editor-header {
            background: #1b212f;
            padding: 12px 18px;
            font-weight: bold;
            color: #b9c7f0;
            border-bottom: 1px solid #2e3a4e;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
        }

        .code-area {
            flex: 1;
            width: 100%;
            background: #0f131e;
            color: #e4f0ff;
            border: none;
            font-family: 'Fira Code', 'Cascadia Code', monospace;
            font-size: 13px;
            line-height: 1.5;
            padding: 18px;
            resize: none;
            outline: none;
            tab-size: 4;
        }

        /* Панель предпросмотра */
        .preview-panel {
            flex: 1;
            background: #ffffff;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            border: 1px solid #2c3548;
        }

        .preview-header {
            background: #eef2ff;
            padding: 10px 16px;
            font-weight: bold;
            color: #1e2a3a;
            border-bottom: 1px solid #cbd5e6;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        iframe {
            width: 100%;
            flex: 1;
            border: none;
            background: white;
        }

        /* статус */
        .status-msg {
            font-size: 0.7rem;
            color: #6f7c9e;
            margin-left: 8px;
        }

        @media (max-width: 800px) {
            .workspace {
                flex-direction: column;
            }
            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            .tabs, .action-group {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="toolbar">
        <div class="tabs">
            <button class="tab-btn active" data-mode="integrated">🌐 Целостный код</button>
            <button class="tab-btn" data-mode="html">📄 HTML</button>
            <button class="tab-btn" data-mode="css">🎨 CSS</button>
            <button class="tab-btn" data-mode="js">⚡ JavaScript</button>
        </div>
        <div class="action-group">
            <button id="runBtn" class="btn btn-primary">▶ Запустить / Обновить</button>
            <button id="downloadBtn" class="btn">⬇ Скачать .html</button>
        </div>
    </div>

    <div class="workspace">
        <!-- Панель редактора кода -->
        <div class="editor-panel">
            <div class="editor-header">
                <span id="editorLabel">✍️ Редактор (целостный HTML)</span>
                <span class="status-msg" id="liveStatus">⚡ готово</span>
            </div>
            <textarea id="codeEditor" class="code-area" spellcheck="false"></textarea>
        </div>

        <!-- Панель результата -->
        <div class="preview-panel">
            <div class="preview-header">
                <span>🔍 Предпросмотр (живой)</span>
                <span style="font-size: 11px;">🖱 автообновление после запуска</span>
            </div>
            <iframe id="previewFrame" title="preview" sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-modals"></iframe>
        </div>
    </div>
</div>

<script>
    // --- DOM элементы ---
    const codeEditor = document.getElementById('codeEditor');
    const previewFrame = document.getElementById('previewFrame');
    const runBtn = document.getElementById('runBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const editorLabel = document.getElementById('editorLabel');
    const liveStatus = document.getElementById('liveStatus');

    // --- Режимы ---
    let currentMode = 'integrated';   // 'integrated', 'html', 'css', 'js'
    
    // Хранилище отдельных частей (для режимов раздельной разработки)
    let separateHTML = `<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя страница</title>
    <style>
        body {
            font-family: system-ui, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e9eef5 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(4px);
            border-radius: 2rem;
            padding: 2rem;
            box-shadow: 0 20px 35px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            border: 1px solid rgba(255,255,255,0.5);
        }
        h1 { color: #1e3c72; }
        button {
            background: #2c5f8a;
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 40px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background: #18435c;
            transform: scale(1.02);
        }
        .counter {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>✨ Живая песочница ✨</h1>
        <p>Редактируй HTML, CSS, JS раздельно или единым кодом!</p>
        <button id="clickBtn">Нажми меня</button>
        <div class="counter">Нажатий: <span id="countDisplay">0</span></div>
    </div>
    <script>
        let count = 0;
        const btn = document.getElementById('clickBtn');
        const display = document.getElementById('countDisplay');
        if(btn) {
            btn.addEventListener('click', () => {
                count++;
                display.innerText = count;
            });
        }
    <\/script>
</body>
</html>`;

    let separateCSS = `/* Ваши стили CSS */
body {
    background: #eef2ff;
    font-family: system-ui;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}
.preview-box {
    background: white;
    border-radius: 28px;
    padding: 30px;
    box-shadow: 0 20px 30px -10px rgba(0,0,0,0.2);
    text-align: center;
    max-width: 450px;
}
h2 {
    color: #0f2b3d;
}
button {
    background: #3b82f6;
    border: none;
    border-radius: 60px;
    padding: 10px 24px;
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}
button:hover {
    background: #2563eb;
    transform: translateY(-2px);
}
`;

    let separateJS = `// Ваш JavaScript код
console.log("Привет из редактора JS!");
function updateTime() {
    const timeDiv = document.getElementById('timeMessage');
    if(timeDiv) {
        timeDiv.innerText = new Date().toLocaleTimeString();
    }
}
// Простой пример: счётчик кликов + динамическое приветствие
document.addEventListener('DOMContentLoaded', () => {
    let clicks = 0;
    const jsBtn = document.getElementById('jsActionBtn');
    const counterSpan = document.getElementById('jsCounter');
    if(jsBtn) {
        jsBtn.addEventListener('click', () => {
            clicks++;
            if(counterSpan) counterSpan.innerText = clicks;
            alert('Клик! Счёт: ' + clicks);
        });
    }
    updateTime();
    setInterval(updateTime, 1000);
});
`;

    // Полноценный демо-код для целостного режима (интегрированный)
    let integratedDemo = `<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интегрированное приложение</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(145deg, #1c1f2c, #2a2e3f);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1.5rem;
        }
        .glass-panel {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            padding: 2rem;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 25px 40px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
            text-align: center;
            transition: all 0.3s;
        }
        h1 {
            font-size: 2.2rem;
            background: linear-gradient(135deg, #FFE6B0, #FFB347);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
        }
        p {
            color: #ddd;
            margin-bottom: 1.5rem;
        }
        button {
            background: #f97316;
            border: none;
            padding: 12px 26px;
            border-radius: 60px;
            font-weight: bold;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            margin: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        button:hover {
            background: #ea580c;
            transform: scale(0.98);
        }
        .counter-area {
            margin-top: 25px;
            background: rgba(0,0,0,0.3);
            border-radius: 40px;
            padding: 12px;
            color: #FFE6B0;
            font-weight: bold;
            font-size: 1.4rem;
        }
        footer {
            margin-top: 20px;
            font-size: 0.75rem;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="glass-panel">
        <h1>🚀 Компилятор ONE</h1>
        <p>HTML + CSS + JS в едином коде. Работает мгновенно!</p>
        <button id="actionButton">Нажми на меня 🌟</button>
        <div class="counter-area">
            🔥 Счётчик кликов: <span id="clickValue">0</span>
        </div>
        <footer>← можно менять код | скачать как .html</footer>
    </div>
    <script>
        let clicks = 0;
        const btn = document.getElementById('actionButton');
        const counterSpan = document.getElementById('clickValue');
        if(btn) {
            btn.addEventListener('click', () => {
                clicks++;
                counterSpan.innerText = clicks;
                // анимация
                btn.style.transform = 'scale(0.95)';
                setTimeout(() => { if(btn) btn.style.transform = ''; }, 150);
            });
        }
        console.log("Полноценный компилятор готов!");
    <\/script>
</body>
</html>`;

    // --- вспомогательные функции ---
    function getCurrentFullHTML() {
        if (currentMode === 'integrated') {
            return codeEditor.value;
        } 
        else if (currentMode === 'html') {
            // в режиме HTML: используем текущий HTML как основу + CSS и JS вставляем внутрь?
            // Но правильнее: собираем полноценный документ с обёрткой:
            let htmlContent = codeEditor.value;
            // добавим стили и скрипты если они не пустые
            if (separateCSS.trim() !== "") {
                // если в htmlContent уже есть <style>? вставим перед </head>
                if (htmlContent.toLowerCase().includes('</head>')) {
                    htmlContent = htmlContent.replace('</head>', `<style>\n${separateCSS}\n</style>\n</head>`);
                } else if (htmlContent.toLowerCase().includes('<body')) {
                    htmlContent = htmlContent.replace('<body', `<style>\n${separateCSS}\n</style>\n<body`);
                } else {
                    htmlContent = `<style>${separateCSS}</style>\n${htmlContent}`;
                }
            }
            if (separateJS.trim() !== "") {
                // вставить script перед </body>
                if (htmlContent.toLowerCase().includes('</body>')) {
                    htmlContent = htmlContent.replace('</body>', `<script>\n${separateJS}\n<\/script>\n</body>`);
                } else {
                    htmlContent = htmlContent + `<script>\n${separateJS}\n<\/script>`;
                }
            }
            return htmlContent;
        }
        else if (currentMode === 'css') {
            // Создаем базовую HTML структуру, только CSS и JS
            let baseHtml = `<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CSS + JS Песочница</title><style>${codeEditor.value}</style></head>
<body>
<div class="demo-wrapper" style="padding:2rem; text-align:center; font-family:sans-serif;">
    <div class="card-example" style="background:white; border-radius:1.5rem; padding:2rem; max-width:500px; margin:auto; box-shadow:0 8px 20px rgba(0,0,0,0.1);">
        <h2>✨ Живой CSS-компилятор ✨</h2>
        <p>Твой CSS применяется выше, а JS ниже — интерактивность</p>
        <button id="cssDemoBtn">Проверить JS</button>
        <p id="cssMessage">Нажми кнопку</p>
    </div>
</div>
<script>${separateJS}<\/script>
<script>
    // дополнительная инициализация если кнопка существует
    document.getElementById('cssDemoBtn')?.addEventListener('click', () => {
        document.getElementById('cssMessage').innerText = 'JS работает! Стили активны ✔️';
    });
<\/script>
</body>
</html>`;
            return baseHtml;
        }
        else if (currentMode === 'js') {
            // режим JS: базовая HTML + встроенный стиль + пользовательский JS
            let htmlWithJs = `<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>JavaScript редактор</title><style>
    body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: monospace; }
    .js-card { background: #1e293b; color: #cbd5e6; padding: 30px; border-radius: 2rem; text-align: center; box-shadow: 0 15px 30px rgba(0,0,0,0.3); }
    button { background: #0f172a; border: 1px solid #38bdf8; color: white; padding: 8px 18px; border-radius: 40px; margin: 8px; cursor: pointer; }
</style></head>
<body>
<div class="js-card">
    <h3>⚡ JavaScript-код (динамика)</h3>
    <p id="dynamicText">Нажми кнопку и измени меня</p>
    <button id="jsDemoExec">Исполнить JS логику</button>
</div>
<script>
    // пользовательский скрипт
    ${codeEditor.value}
    // дополнительная привязка демо
    document.getElementById('jsDemoExec')?.addEventListener('click', () => {
        const txt = document.getElementById('dynamicText');
        if(txt) txt.innerText = '✅ JS-код сработал! Дата: ' + new Date().toLocaleTimeString();
    });
<\/script>
</body>
</html>`;
            return htmlWithJs;
        }
        return integratedDemo;
    }

    // Рендер (обновление iframe)
    function renderPreview() {
        try {
            let fullHtml = getCurrentFullHTML();
            // проверка на пустоту
            if (!fullHtml.trim()) fullHtml = "<h1 style='color:red;'>⚠️ Пустой код, вставьте разметку</h1>";
            // Запись в iframe
            const doc = previewFrame.contentDocument || previewFrame.contentWindow.document;
            doc.open();
            doc.write(fullHtml);
            doc.close();
            liveStatus.innerHTML = "✅ обновлено " + new Date().toLocaleTimeString();
        } catch(e) {
            liveStatus.innerHTML = "❌ ошибка рендера";
            console.error(e);
        }
    }

    // Загрузка содержимого редактора в зависимости от режима
    function loadEditorByMode() {
        if (currentMode === 'integrated') {
            codeEditor.value = integratedDemo;
            editorLabel.innerText = "📄 Целостный HTML / CSS / JS (полный документ)";
        } else if (currentMode === 'html') {
            codeEditor.value = separateHTML;
            editorLabel.innerText = "🏷️ Только HTML (CSS и JS будут добавлены автоматически)";
        } else if (currentMode === 'css') {
            codeEditor.value = separateCSS;
            editorLabel.innerText = "🎨 Только CSS (авто-обёртка + JS из хранилища)";
        } else if (currentMode === 'js') {
            codeEditor.value = separateJS;
            editorLabel.innerText = "📜 Только JavaScript (авто-базовый HTML/CSS)";
        }
        liveStatus.innerHTML = "режим изменён";
    }

    // Сохранить изменения в соответствующих хранилищах при редактировании (когда пользователь меняет код)
    function syncCurrentCodeToStorage() {
        const currentCode = codeEditor.value;
        if (currentMode === 'integrated') {
            integratedDemo = currentCode;
        } else if (currentMode === 'html') {
            separateHTML = currentCode;
        } else if (currentMode === 'css') {
            separateCSS = currentCode;
        } else if (currentMode === 'js') {
            separateJS = currentCode;
        }
    }

    // Обработчик переключения вкладок
    const tabBtns = document.querySelectorAll('.tab-btn');
    tabBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
            // синхронизируем текущий код перед сменой
            syncCurrentCodeToStorage();
            const mode = btn.getAttribute('data-mode');
            currentMode = mode;
            // обновляем активный класс
            tabBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            // загружаем редактор соответственно новому режиму
            loadEditorByMode();
            // сразу рендерим предпросмотр
            renderPreview();
        });
    });

    // Кнопка запуска (явное обновление)
    runBtn.addEventListener('click', () => {
        syncCurrentCodeToStorage();
        renderPreview();
        liveStatus.innerHTML = "🚀 запуск выполнен!";
        setTimeout(() => {
            if(liveStatus.innerHTML === "🚀 запуск выполнен!") 
                liveStatus.innerHTML = "✅ готово";
        }, 1200);
    });

    // Скачивание .html файла (целостный результат)
    downloadBtn.addEventListener('click', () => {
        syncCurrentCodeToStorage();
        let finalHtml = getCurrentFullHTML();
        if (!finalHtml.trim()) finalHtml = "<h1>Ошибка: пустой вывод</h1>";
        const blob = new Blob([finalHtml], {type: 'text/html'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `compiled_${currentMode}_${Date.now()}.html`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        liveStatus.innerHTML = "💾 скачан файл .html";
        setTimeout(() => { if(liveStatus.innerHTML.includes("скачан")) liveStatus.innerHTML = "✅ готово"; }, 1500);
    });

    // автосохранение при вводе текста (потеря не страшна)
    codeEditor.addEventListener('input', () => {
        // синхронизация на лету
        if (currentMode === 'integrated') integratedDemo = codeEditor.value;
        else if (currentMode === 'html') separateHTML = codeEditor.value;
        else if (currentMode === 'css') separateCSS = codeEditor.value;
        else if (currentMode === 'js') separateJS = codeEditor.value;
        // опционально авто-обновление можно раскомментить, но сделаем только по кнопке или тоже авто?
        // задержка чтобы не фризить, но сделаем щадящее авто (для удобства)
        // но лучше пользователь сам нажимает запуск, однако добавим «тихий» превью если нужно, но не обязательно
        // по желанию раскомментируйте: 
        // если хотите автообновление при печати — раскомментировать строку ниже:
        // debouncedRender();
    });

    // для плавного автообновления (доп опция, но необязательно, так как есть кнопка Run)
    let timeoutId;
    function debouncedRender() {
        if(timeoutId) clearTimeout(timeoutId);
        timeoutId = setTimeout(() => {
            renderPreview();
        }, 500);
    }
    // По желанию раскомментить 2 строки ниже для моментального предпросмотра при печати — оно работает аккуратно
    // codeEditor.addEventListener('input', () => { syncCurrentCodeToStorage(); debouncedRender(); });
    // Но чтобы не сбивать с толку, явный запуск предпочтительнее. Оставим только кнопку, однако пользователь жмёт "запуск". 
    // Для лучшего UX добавим, что при переключении режимов уже рендер. А при вводе - только кнопка.
    // Но некоторые любят мгновенность - сделаем легкий авторефреш через 0.7 сек после остановки ввода.
    codeEditor.addEventListener('input', () => {
        syncCurrentCodeToStorage();
        if(timeoutId) clearTimeout(timeoutId);
        timeoutId = setTimeout(() => {
            renderPreview();
            liveStatus.innerHTML = "🔄 автообновление";
        }, 700);
    });
    
    // Инициализация
    loadEditorByMode();
    renderPreview();
</script>
</body>
</html>
